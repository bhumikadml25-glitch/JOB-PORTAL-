<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first page</title>
<link rel="stylesheet" href="./src/output.css">
    <!-- Tailwind CSS -->
   
</head>

<body class="bg-slate-100">

    <!-- Header Section -->
    <header class="bg-slate-950 text-white">

        <div class="max-w-7xl mx-auto px-8 py-6 
                    flex items-center justify-between">

            <!-- Portal Name + Welcome Line -->
            <div>
                <h1 class="text-3xl font-bold">
                    Career<span class="text-cyan-400">Sphere</span>
                </h1>

                <p class="text-sm text-slate-400 mt-1">
                    Welcome! Find opportunities and build your future.
                </p>
            </div>


            <!-- Three Buttons -->
            <div class="flex items-center gap-3">

                <button class="px-5 py-2 rounded-full
                               text-slate-300
                               hover:bg-white/10
                               hover:text-white
                               transition">
                    Home
                </button>


                <button class="px-5 py-2 rounded-full
                               bg-white/10
                               text-white
                               hover:bg-white/20
                               transition">
                    Find Jobs
                </button>


                <button class="px-6 py-2 rounded-full
                               bg-gradient-to-r
                               from-purple-500 to-cyan-400
                               text-white font-semibold
                               hover:opacity-90
                               transition">
                    Post a Job
                </button>

            </div>

        </div>

    </header>
</body>
</html>
