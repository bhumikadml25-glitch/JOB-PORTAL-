<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Day-2</title>
</head>
<body>
    <body class="bg-slate-100">

    <!-- ================= HEADER ================= -->

    <header class="bg-slate-950 text-white">

        <div class="max-w-7xl mx-auto px-8 py-6 
                    flex items-center justify-between">

            <!-- Portal Name -->
            <div>
                <h1 class="text-3xl font-bold">
                    Career<span class="text-cyan-400">Sphere</span>
                </h1>

                <p class="text-sm text-slate-400 mt-1">
                    Welcome! Find opportunities and build your future.
                </p>
            </div>

            <!-- Three Buttons -->
            <div class="flex items-center gap-3">

                <button class="px-5 py-2 rounded-full
                               text-slate-300
                               hover:bg-white/10
                               hover:text-white
                               transition">
                    Home
                </button>

                <button class="px-5 py-2 rounded-full
                               bg-white/10
                               text-white
                               hover:bg-white/20
                               transition">
                    Find Jobs
                </button>

                <button class="px-6 py-2 rounded-full
                               bg-gradient-to-r
                               from-purple-500 to-cyan-400
                               text-white font-semibold
                               hover:opacity-90
                               transition">
                    Post a Job
                </button>

            </div>

        </div>

    </header>


    <!-- ================= JOB SEARCH SECTION ================= -->

    <section class="max-w-6xl mx-auto px-6 py-14">

        <!-- Heading -->
        <div class="text-center mb-8">

            <h2 class="text-4xl font-bold text-slate-900">
                Find Your Next
                <span class="text-purple-600">Opportunity</span>
            </h2>

            <p class="text-slate-500 mt-3">
                Search for jobs that match your skills, goals and career.
            </p>

        </div>


        <!-- Search Box -->
        <div class="bg-white rounded-2xl p-6
                    shadow-xl border border-slate-200">

            <div class="grid md:grid-cols-3 gap-5">

                <!-- Job Title -->
                <div>
                    <label class="block text-sm font-semibold
                                  text-slate-700 mb-2">
                        Job Title
                    </label>

                    <input
                        type="text"
                        placeholder="e.g. Software Developer"
                        class="w-full px-4 py-3
                               rounded-xl
                               border border-slate-200
                               outline-none
                               focus:ring-2
                               focus:ring-purple-400
                               focus:border-purple-400">
                </div>


                <!-- Location -->
                <div>
                    <label class="block text-sm font-semibold
                                  text-slate-700 mb-2">
                        Location
                    </label>

                    <input
                        type="text"
                        placeholder="e.g. Pune, Bangalore"
                        class="w-full px-4 py-3
                               rounded-xl
                               border border-slate-200
                               outline-none
                               focus:ring-2
                               focus:ring-cyan-400
                               focus:border-cyan-400">
                </div>


                <!-- Search Button -->
                <div class="flex items-end">

                    <button
                        class="w-full px-6 py-3
                               rounded-xl
                               bg-gradient-to-r
                               from-purple-500 to-cyan-400
                               text-white font-semibold
                               shadow-md
                               hover:shadow-lg
                               hover:scale-[1.02]
                               transition">

                        🔍 Search Jobs

                    </button>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
</body>
</html>
